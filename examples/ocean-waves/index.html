<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ocean Waves</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04121f; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="waves"></canvas>
<script>
const canvas = document.getElementById('waves');
const ctx = canvas.getContext('2d');
let W, H, t = 0;

function resize() {
  W = canvas.width = innerWidth * devicePixelRatio;
  H = canvas.height = innerHeight * devicePixelRatio;
}
addEventListener('resize', resize);
resize();

function wave(yBase, amp, speed, color) {
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 8) {
    const y = yBase * H + Math.sin(x * 0.002 + t * speed) * amp
              + Math.sin(x * 0.005 - t * speed * 0.6) * amp * 0.5;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

(function frame() {
  t += 0.008;
  ctx.clearRect(0, 0, W, H);
  wave(0.55, 40, 1.0, 'rgba(30,120,180,0.35)');
  wave(0.65, 30, 0.7, 'rgba(20,90,150,0.45)');
  wave(0.75, 22, 0.5, 'rgba(10,60,110,0.55)');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
